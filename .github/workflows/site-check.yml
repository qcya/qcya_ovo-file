name: Check static homepage
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check generated HTML
        run: python scripts/build.py --check
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: node --check qcya_ovo/assets/site.js
