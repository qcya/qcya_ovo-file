name: Homepage checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SCREENSHOT_DIR: test-results/screenshots
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install test tools
        run: |
          python3 -m pip install pytest==9.0.2 playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify source and browser behavior
        run: |
          python3 scripts/build.py --check
          mkdir -p test-results
          python3 -m http.server 8765 --bind 127.0.0.1 > test-results/server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in 1 2 3 4 5; do
            curl -fsS http://127.0.0.1:8765/ > /dev/null && break
            sleep 1
          done
          python3 -m pytest -q tests --junitxml=test-results/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-browser-results
          path: test-results/
          retention-days: 14
